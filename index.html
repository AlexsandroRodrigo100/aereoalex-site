<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AéreoAlex | Fotos e Vídeos com Drone</title>

<style>
:root{
  --blue:#061b3a;
  --blue2:#0b2d5c;
  --yellow:#ffc400;
  --green:#25d366;
  --white:#fff;
  --gray:#f2f4f7;
  --text:#172033;
  --danger:#e53935;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--gray);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--blue);
  color:#fff;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.logo{
  font-size:24px;
  font-weight:900;
  color:var(--yellow);
}

.logo span{
  color:#fff;
}

.cart-btn{
  background:var(--yellow);
  color:#111;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  min-height:360px;
  background:
    linear-gradient(rgba(0,20,50,.65),rgba(0,20,50,.75)),
    url("https://images.unsplash.com/photo-1473968512647-3e447244af8f?auto=format&fit=crop&w=1600&q=80")
    center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  padding:40px 20px;
}

.hero h1{
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  max-width:700px;
  margin:auto;
  line-height:1.6;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:35px 18px;
}

.tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:25px;
}

.tabs button{
  border:0;
  background:#fff;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
}

.tabs button.active{
  background:var(--blue);
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  position:relative;
}

.badge{
  position:absolute;
  top:12px;
  right:12px;
  background:var(--yellow);
  color:#111;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card h3{
  margin-bottom:10px;
  font-size:19px;
}

.card p{
  color:#667085;
  min-height:42px;
  line-height:1.4;
}

.price{
  font-size:25px;
  font-weight:900;
  margin:18px 0;
  color:var(--blue);
}

.add-btn{
  width:100%;
  border:0;
  background:var(--blue);
  color:#fff;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:var(--blue2);
}

.address-box{
  margin-top:35px;
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.address-box h2{
  margin-bottom:10px;
}

.address-box p{
  color:#667085;
  margin-bottom:15px;
  line-height:1.5;
}

.address-input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

.address-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.address-actions button{
  border:0;
  padding:13px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.calculate-btn{
  background:var(--blue);
  color:#fff;
}

.add-address-btn{
  background:var(--yellow);
  color:#111;
  display:none;
}

.address-status{
  margin-top:14px;
  font-weight:bold;
}

.distance-result{
  display:none;
  margin-top:15px;
  background:#f6f8fb;
  padding:15px;
  border-radius:10px;
  line-height:1.7;
}

.info{
  margin-top:25px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  line-height:1.7;
}

.how{
  margin-top:40px;
}

.how-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
  margin-top:20px;
}

.how-card{
  background:#fff;
  padding:22px;
  border-radius:15px;
  text-align:center;
}

.how-card .icon{
  font-size:35px;
  margin-bottom:10px;
}

.cta{
  margin-top:40px;
  background:var(--blue);
  color:#fff;
  padding:40px 20px;
  text-align:center;
  border-radius:20px;
}

.cta h2{
  margin-bottom:10px;
}

.whats{
  display:inline-block;
  margin-top:20px;
  background:var(--green);
  color:#fff;
  text-decoration:none;
  padding:15px 24px;
  border-radius:12px;
  font-weight:bold;
}

footer{
  background:#031329;
  color:#fff;
  text-align:center;
  padding:30px 15px;
  margin-top:40px;
  line-height:1.8;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:999;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:25px;
  animation:up .25s ease;
}

@keyframes up{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:#f7f8fa;
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-weight:bold;
}

.cart-price{
  color:#475467;
  margin-top:5px;
}

.remove-btn{
  border:0;
  background:#ffe5e5;
  color:var(--danger);
  padding:9px 11px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
}

.address-cart{
  background:#eef5ff;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  margin-bottom:10px;
}

.address-cart-title{
  font-weight:bold;
  margin-bottom:7px;
}

.address-cart-text{
  color:#475467;
  line-height:1.5;
  word-break:break-word;
}

.remove-address{
  border:0;
  margin-top:10px;
  background:#ffe5e5;
  color:var(--danger);
  padding:9px 11px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.distance-cart{
  margin-top:8px;
  color:#475467;
  line-height:1.5;
}

.total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:22px;
  font-weight:900;
  padding:20px 0;
  border-top:1px solid #ddd;
  margin-top:15px;
}

.send{

  border:0;
