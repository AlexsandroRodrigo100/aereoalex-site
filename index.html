<!-- ALEX IA - AÉREOALEX -->
<style>
#alex-launch {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 66px;
  height: 66px;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(135deg,#00c6ff,#1744dc);
  color: white;
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 8px 30px #007bff66;
  z-index: 9998;
}

#alex-chat {
  position: fixed;
  right: 15px;
  bottom: 95px;
  width: min(390px, calc(100vw - 30px));
  height: min(580px, calc(100dvh - 115px));
  background: #0b1222;
  color: white;
  border: 1px solid #29436c;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 55px #0009;
  z-index: 9999;
  display: none;
  flex-direction: column;
  font-family: Arial, sans-serif;
}

#alex-chat.open {
  display: flex;
}

.alex-header {
  padding: 18px;
  background: linear-gradient(120deg,#102a66,#067bdb);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.alex-header strong {
  font-size: 20px;
}

.alex-header small {
  display: block;
  margin-top: 5px;
  color: #d5efff;
}

#alex-close {
  background: transparent;
  border: 0;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

#alex-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overscroll-behavior: contain;
}

.alex-bubble {
  padding: 12px 14px;
  border-radius: 15px;
  max-width: 88%;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.alex-bot {
  background: #1c2a42;
  align-self: flex-start;
}

.alex-user {
  background: #075bd7;
  align-self: flex-end;
}

#alex-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #101b30;
  border-top: 1px solid #30415e;
}

#alex-input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #395172;
  border-radius: 12px;
  background: #182842;
  color: white;
  font-size: 16px;
  outline: none;
}

#alex-input:focus {
  border-color: #00c6ff;
}

#alex-send {
  border: 0;
  border-radius: 12px;
  padding: 0 17px;
  background: #087df0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#alex-send:disabled {
  opacity: .5;
  cursor: wait;
}

#alex-status {
  padding: 0 12px 9px;
  font-size: 12px;
  color: #9ab1d1;
}
</style>

<button id="alex-launch"
  type="button"
  aria-label="Abrir Alex IA">✦</button>

<section id="alex-chat" aria-label="Alex IA">
  <div class="alex-header">
    <div>
      <strong>✦ Alex IA</strong>
      <small>Assistente virtual AéreoAlex</small>
    </div>
    <button id="alex-close"
      type="button"
      aria-label="Fechar">×</button>
  </div>

  <div id="alex-messages" role="log"
    aria-live="polite">
    <div class="alex-bubble alex-bot">
      Olá! 👋 Sou a Alex IA.
      Como posso ajudar com nossos
      serviços de drones?
    </div>
  </div>

  <form id="alex-form">
    <input id="alex-input"
      type="text"
      placeholder="Digite sua mensagem..."
      autocomplete="off"
      maxlength="2000"
      required>
    <button id="alex-send"
      type="submit">Enviar</button>
  </form>
  <div id="alex-status" role="status"></div>
</section>

<script>
(() => {
  // SUBSTITUA PELA URL REAL DO SEU WORKER
  const API_URL =
    "https://alex-ia-api.SEU-SUBDOMINIO.workers.dev";

  const chat = document.getElementById("alex-chat");
  const launch = document.getElementById("alex-launch");
  const close = document.getElementById("alex-close");
  const form = document.getElementById("alex-form");
  const input = document.getElementById("alex-input");
  const send = document.getElementById("alex-send");
  const messages = document.getElementById("alex-messages");
  const status = document.getElementById("alex-status");

  const history = [];
  let busy = false;

  launch.addEventListener("click", () => {
    chat.classList.toggle("open");
    if (chat.classList.contains("open")) {
      input.focus();
    }
  });

  close.addEventListener("click", () => {
    chat.classList.remove("open");
  });

  function addMessage(text, role) {
    const bubble = document.createElement("div");
    bubble.className = "alex-bubble " +
      (role === "user" ? "alex-user" : "alex-bot");

    // textContent evita injeção de HTML.
    bubble.textContent = text;
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message || busy) return;

    if (API_URL.includes("SEU-SUBDOMINIO")) {
      addMessage(
        "Configure a URL do servidor Alex IA.",
        "assistant"
      );
      return;
    }

    busy = true;
    send.disabled = true;
    input.disabled = true;
    status.textContent = "Alex IA está digitando...";

    addMessage(message, "user");
    input.value = "";

    const conversation = [
      ...history,
      { role: "user", content: message }
    ].slice(-12);

    try {
      const controller = new AbortController();
      const timeout = setTimeout(
        () => controller.abort(), 25000
      );

      let response;

      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: conversation
          }),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Erro HTTP " + response.status
        );
      }

      if (typeof data.reply !== "string") {
        throw new Error("Resposta inválida");
      }

      addMessage(data.reply, "assistant");

      history.push(
        { role: "user", content: message },
        { role: "assistant", content: data.reply }
      );

      if (history.length > 10) {
        history.splice(0, history.length - 10);
      }

      status.textContent = "Alex IA online";

    } catch (error) {
      console.error("Alex IA:", error);
      addMessage(
        "Não consegui responder agora. " +
        "Verifique a conexão ou tente novamente.",
        "assistant"
      );
      status.textContent = "Falha na conexão";
    } finally {
      busy = false;
      send.disabled = false;
      input.disabled = false;
      input.focus();
    }
  });
})();
</script>
<!-- FIM ALEX IA -->
