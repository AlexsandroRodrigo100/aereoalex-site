
<!-- ALEX IA - CHAT FLUTUANTE -->
<style>
#alex-ia-toggle {
  position: fixed !important;
  right: 18px !important;
  bottom: 22px !important;
  z-index: 99999 !important;
  display: flex !important;
  align-items: center;
  gap: 9px;
  padding: 14px 18px;
  border: 0;
  border-radius: 50px;
  background: linear-gradient(135deg,#1688ff,#074bc4);
  color: white;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 8px 30px #006dff80;
  cursor: pointer;
}

#alex-ia-chat {
  display: none;
  position: fixed;
  right: 12px;
  bottom: 85px;
  z-index: 99999;
  width: min(390px,calc(100vw - 24px));
  height: min(540px,calc(100dvh - 110px));
  background: #0a1021;
  border: 1px solid #2855a0;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 50px #000a;
  flex-direction: column;
}

#alex-ia-chat.open {
  display: flex;
}

.alex-ia-header {
  background: #173e80;
  color: white;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.alex-ia-header strong {
  font-size: 21px;
}

.alex-ia-header small {
  display: block;
  margin-top: 5px;
  color: #c7dcff;
}

.alex-ia-close {
  background: transparent;
  border: 0;
  color: white;
  font-size: 26px;
}

#alex-ia-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.alex-ia-message {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.alex-ia-message.bot {
  background: #20304c;
  align-self: flex-start;
}

.alex-ia-message.user {
  background: #075bd4;
  align-self: flex-end;
}

#alex-ia-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #273751;
}

#alex-ia-input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #38517c;
  background: #101d33;
  color: white;
  font-size: 16px;
  outline: none;
}

#alex-ia-send {
  background: #0865ed;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 0 15px;
  font-weight: bold;
}

#alex-ia-send:disabled {
  opacity: .5;
}
</style>

<button id="alex-ia-toggle"
  type="button"
  aria-label="Abrir Alex IA">
  🤖 Alex IA
</button>

<section id="alex-ia-chat"
  role="dialog"
  aria-label="Conversa com Alex IA">

  <div class="alex-ia-header">
    <div>
      <strong>🤖 Alex IA</strong>
      <small>Assistente virtual AéreoAlex</small>
    </div>
    <button class="alex-ia-close"
      id="alex-ia-close"
      type="button"
      aria-label="Fechar conversa">×</button>
  </div>

  <div id="alex-ia-messages"
    aria-live="polite">
    <div class="alex-ia-message bot">
      Olá! 👋 Sou a Alex IA.
      Como posso ajudar com nossos
      serviços de drones?
    </div>
  </div>

  <form id="alex-ia-form">
    <input id="alex-ia-input"
      type="text"
      placeholder="Digite sua mensagem..."
      maxlength="2000"
      autocomplete="off"
      required>
    <button id="alex-ia-send"
      type="submit">Enviar</button>
  </form>
</section>

<script>
(() => {
  const API_URL =
    "https://alex-ia.alexsandro-rodrigo100.workers.dev";

  const toggle =
    document.getElementById("alex-ia-toggle");
  const chat =
    document.getElementById("alex-ia-chat");
  const close =
    document.getElementById("alex-ia-close");
  const form =
    document.getElementById("alex-ia-form");
  const input =
    document.getElementById("alex-ia-input");
  const send =
    document.getElementById("alex-ia-send");
  const messages =
    document.getElementById("alex-ia-messages");

  const history = [];
  let sending = false;

  toggle.addEventListener("click", () => {
    chat.classList.toggle("open");
    if (chat.classList.contains("open")) {
      input.focus();
    }
  });

  close.addEventListener("click", () => {
    chat.classList.remove("open");
  });

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "alex-ia-message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    send.disabled = true;
    input.value = "";

    addMessage(text, "user");

    const pending = addMessage(
      "Alex IA está digitando...", "bot"
    );

    try {
      const conversation = [
        ...history,
        { role: "user", content: text }
      ].slice(-12);

      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: conversation
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Servidor indisponível"
        );
      }

      if (!data.reply) {
        throw new Error("Resposta vazia");
      }

      pending.textContent = data.reply;

      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      if (history.length > 10) {
        history.splice(0, history.length - 10);
      }

    } catch (error) {
      pending.textContent =
        "Não consegui conectar ao servidor Alex IA. " +
        "Verifique a configuração do Cloudflare.";
      console.error("Alex IA:", error);
    } finally {
      sending = false;
      send.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  });
})();
</script>
<!-- FIM DA ALEX IA -->
