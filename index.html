<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AéreoAlex | Fotografia e Vídeos Aéreos</title>

<style>
:root{
  --blue:#061b52;
  --blue2:#0b3d96;
  --yellow:#ffd800;
  --white:#fff;
  --bg:#f5f6f8;
  --text:#172033;
  --green:#19a463;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,#03143d,#0b3d96);
  color:#fff;
  padding:20px 5%;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 15px #0004;
}

.nav{
  max-width:1150px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:34px;
  font-weight:900;
  font-style:italic;
}

.logo span{
  color:var(--yellow);
}

.tag{
  font-size:13px;
  opacity:.9;
}

.cart{
  background:var(--yellow);
  color:#111;
  border:0;
  border-radius:25px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
}

.hero{
  background:
  linear-gradient(135deg,#08265fdd,#1260b8dd),
  url('https://images.unsplash.com/photo-1478827387698-1527781a4887?auto=format&fit=crop&w=1600&q=80')
  center/cover;

  min-height:330px;
  color:#fff;
  display:flex;
  align-items:center;
}

.hero-in{
  max-width:1150px;
  width:90%;
  margin:auto;
}

.hero h1{
  font-size:clamp(36px,6vw,68px);
  margin:0 0 10px;
}

.hero h1 span{
  color:var(--yellow);
}

.hero p{
  font-size:20px;
  max-width:680px;
}

.wrap{
  max-width:1150px;
  margin:35px auto;
  padding:0 18px;
}

h2{
  font-size:30px;
  margin:0 0 8px;
}

.sub{
  color:#687080;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:22px;
}

.tab{
  border:0;
  border-radius:22px;
  padding:12px 18px;
  background:#fff;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background:var(--yellow);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px #10234b12;
  border:1px solid #e6e8ee;
  position:relative;
}

.card.popular{
  border:3px solid var(--yellow);
  transform:translateY(-2px);
}

.badge{
  position:absolute;
  right:15px;
  top:15px;
  background:var(--yellow);
  padding:6px 10px;
  border-radius:15px;
  font-size:11px;
  font-weight:900;
}

.icon{
  font-size:38px;
}

.card h3{
  font-size:22px;
  margin:10px 0;
}

.price{
  font-size:30px;
  font-weight:900;
  color:var(--blue
